<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Quién Quiere Ser Millonario? — Resultados</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="app-container">
    <header class="header-nav">
      <a href="index.html" class="brand-logo">
        <span class="logo-gold">MILLIONAIRE</span>
        <span class="logo-pink">GAME</span>
      </a>
      <button id="language-toggle" class="btn btn-secondary" type="button">English</button>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center;">
      <div class="glass-card gold-border anim-fade-in" style="max-width: 580px; width: 100%; padding: 3rem 2.5rem; text-align: center;">
        
        <div id="result-icon" class="anim-floating" style="font-size: 4rem; margin-bottom: 1rem;">
          🏆
        </div>

        <h1 id="result-title" style="font-size: 2.2rem; font-weight: 900; margin-bottom: 0.5rem; text-transform: uppercase;">
          ¡VICTORIA TOTAL!
        </h1>
        
        <p id="result-message" style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">
          ¡Has respondido todas las preguntas correctamente!
        </p>

        <!-- Tarjeta de Premio Final -->
        <div style="background: rgba(13, 21, 45, 0.9); border: 2px solid rgba(241, 196, 15, 0.4); border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--gold-glow);">
          <span style="font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; display: block; margin-bottom: 0.35rem;">
            Premio Final Obtenido
          </span>
          <span id="final-prize" style="font-size: 2.5rem; font-weight: 900; color: var(--gold-primary); text-shadow: 0 0 15px rgba(243, 156, 18, 0.5);">
            $1.000.000
          </span>
          <div style="margin-top: 0.75rem; color: var(--text-main); font-size: 0.95rem;">
            Jugador: <strong id="result-player" style="color: var(--btn-pink);">Jugador</strong>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <a href="index.html" class="btn btn-primary" style="padding: 1rem; font-size: 1.1rem;">
            🎮 Jugar Otra Partida
          </a>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <a href="ranking.html" class="btn btn-gold" style="padding: 0.85rem;">
              🏆 Ver Ranking
            </a>
            <a href="index.html" class="btn btn-secondary" style="padding: 0.85rem;">
              🏠 Menú Inicio
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer-bar">
      <p>Millionaire Game — Pantalla de Resultados</p>
    </footer>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
