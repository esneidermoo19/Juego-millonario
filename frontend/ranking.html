<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Quién Quiere Ser Millonario? — Clasificación Top 10</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/ranking.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- Contenedor para notificaciones y alertas -->
  <div id="toast-container" class="toast-container"></div>

  <div class="app-container">
    <header class="header-nav">
      <a href="index.html" class="brand-logo">
        <span class="logo-gold">MILLIONAIRE</span>
        <span class="logo-pink">GAME</span>
      </a>
      <a href="index.html" class="btn btn-secondary">🏠 Inicio</a>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center;">
      <div class="glass-card gold-border ranking-card anim-fade-in">
        
        <div class="ranking-header-title">
          <div style="font-size: 2.8rem; margin-bottom: 0.5rem;">🏆</div>
          <h1>Tabla de Clasificación</h1>
          <p>Los mejores 10 jugadores con los mayores premios acumulados</p>
        </div>

        <div class="ranking-table-wrapper">
          <table class="ranking-table">
            <thead>
              <tr>
                <th style="width: 90px; text-align: center;">Posición</th>
                <th>Jugador</th>
                <th style="text-align: right;">Premio Acumulado</th>
              </tr>
            </thead>
            <tbody id="ranking-body">
              <tr>
                <td colspan="3" class="empty-ranking">
                  ⏳ Cargando mejores puntuaciones...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div style="margin-top: 2rem; display: flex; justify-content: center;">
          <a href="index.html" class="btn btn-primary" style="padding: 0.9rem 2.2rem;">
            🎮 Jugar una Partida
          </a>
        </div>
      </div>
    </main>

    <footer class="footer-bar">
      <p>Millionaire Game — Tabla Top 10 Oficial</p>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ranking.js"></script>
</body>
</html>
